name: PWA UAT

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pwa-uat:
    # macOS runner so the committed *-darwin.png visual baselines are comparable.
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      # Dummy values: nothing here is a secret and nothing ever reaches a real Supabase.
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key-for-uat
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Build (production, dummy Supabase env)
        run: npm run build
      - name: Run PWA UAT suite
        run: npx playwright test
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/.output/
          # tests/.output is a dot-directory; upload-artifact@v4 skips hidden files by default,
          # which is why the failed run had zero artifacts (no -diff.png to inspect).
          include-hidden-files: true
          retention-days: 7
